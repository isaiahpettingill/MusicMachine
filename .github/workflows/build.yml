name: Build and release

on:
  push:
    branches: [main, 'build/**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

env:
  AVALONIA_TELEMETRY_OPTOUT: '1'
  DOTNET_CLI_TELEMETRY_OPTOUT: '1'

permissions:
  contents: read

concurrency:
  group: ${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')) && 'musicmachine-release' || format('validation-{0}', github.ref) }}
  cancel-in-progress: true

jobs:
  prepare:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    outputs:
      version: ${{ steps.version.outputs.version }}
      publish: ${{ steps.version.outputs.publish }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 tools/ci-version.py plan

  tests:
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - run: dotnet test tests/MusicMachine.Tests -c Release
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node --test tools/test-pages.mjs src/MusicMachine.Browser/tests/*.test.js
      - run: python -m unittest discover -s tools -p 'test_release_tools.py' -v
      - name: Test Windows bootstrap integrity and argument handling
        if: runner.os == 'Windows'
        run: powershell -NoProfile -NonInteractive -File tools/test-windows-bootstrap.ps1
      - name: Test Linux installer safety and upgrade paths
        if: runner.os == 'Linux'
        run: |
          bash -n tools/install-linux.sh
          python3 -m unittest discover -s tools -p 'test_linux_installer.py' -v

  desktop:
    needs: [prepare, tests]
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            rid: win-x64
          - os: ubuntu-24.04
            rid: linux-x64
    runs-on: ${{ matrix.os }}
    env:
      MUSIC_RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - run: python tools/ci-version.py stamp
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Install Linux native build and audio dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y clang zlib1g-dev libsdl2-2.0-0 ffmpeg
      - name: Publish native desktop app
        run: dotnet publish src/MusicMachine.Desktop -c Release -r ${{ matrix.rid }} -p:PublishAot=true -o artifacts/${{ matrix.rid }}
      - name: Stage licenses, icons, metadata and Windows audio runtime
        run: python tools/prepare-desktop.py artifacts/${{ matrix.rid }} ${{ matrix.rid }}
      - name: Smoke-test native audio export
        run: python tools/test-native-payload.py artifacts/${{ matrix.rid }}
      - name: Test native Linux updater helper with disposable installs
        if: runner.os == 'Linux'
        run: python3 tools/test-updater-helper.py artifacts/linux-x64/MusicMachine.Desktop
      - name: Archive Windows portable app
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path 'artifacts/win-x64/*' -DestinationPath MusicMachine-win-x64.zip
      - name: Install NSIS
        if: runner.os == 'Windows'
        run: choco install nsis --version=3.12.0 -y --no-progress
      - name: Build and test Windows installer
        if: runner.os == 'Windows'
        run: |
          python tools/package-windows-installer.py artifacts/win-x64 MusicMachine-win-x64-setup.exe
          python tools/test-windows-installer.py MusicMachine-win-x64-setup.exe artifacts/win-x64
          Copy-Item tools/install-windows.ps1 install-musicmachine.ps1
      - name: Archive Linux app and build version-pinned installer
        if: runner.os == 'Linux'
        run: |
          tar -C artifacts/linux-x64 -czf MusicMachine-linux-x64.tar.gz .
          python3 tools/package-linux-installer.py
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.rid }}
          if-no-files-found: error
          path: |
            MusicMachine-${{ matrix.rid }}*
            install-musicmachine.sh
            install-musicmachine.ps1

  browser:
    needs: [prepare, tests]
    runs-on: ubuntu-24.04
    env:
      MUSIC_RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - run: python3 tools/ci-version.py stamp
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Install pinned WebAssembly toolchain
        run: dotnet workload install wasm-tools --skip-manifest-update
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Build and verify audio-only FFmpeg from signed pinned sources
        working-directory: src/MusicMachine.Browser
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm run build:ffmpeg
          npm run vendor:ffmpeg
          npm test
          npm run test:runtime
          npm run verify:distribution
      - name: Verify native-reference formats and real browser worker lifecycle
        working-directory: src/MusicMachine.Browser
        run: |
          if ! command -v ffmpeg >/dev/null; then
            sudo apt-get update
            sudo apt-get install -y ffmpeg
          fi
          npm run test:formats
          export CHROMIUM="$(command -v google-chrome || command -v chromium)"
          test -n "$CHROMIUM"
          npm run test:browser
      - name: Publish browser app with converter source and notices
        run: dotnet publish src/MusicMachine.Browser -c Release -o artifacts/browser
      - name: Prepare browser release and Cloudflare assets
        run: |
          cp LICENSE artifacts/browser/wwwroot/
          cp -r licenses artifacts/browser/wwwroot/
          (cd artifacts/browser/wwwroot && zip -qr ../../../MusicMachine-browser-wasm.zip .)
          node tools/prepare-pages.mjs artifacts/browser/wwwroot artifacts/pages
          (cd artifacts/pages && zip -qr ../MusicMachine-pages.zip .)
      - name: Smoke the actual prepared Avalonia app, keyboard settings and real audio
        run: |
          export CHROMIUM="$(command -v google-chrome || command -v chromium)"
          test -n "$CHROMIUM"
          node src/MusicMachine.Browser/tools/smoke-published-app.mjs artifacts/pages artifacts/browser-app-smoke
      - name: Retain published-app smoke screenshots and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-app-smoke
          path: artifacts/browser-app-smoke
          if-no-files-found: warn
      - uses: actions/upload-artifact@v4
        with:
          name: browser-wasm
          path: MusicMachine-browser-wasm.zip
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: cloudflare-pages
          path: artifacts/MusicMachine-pages.zip
          if-no-files-found: error

  release:
    name: Publish GitHub release
    if: needs.prepare.outputs.publish == 'true'
    needs: [prepare, desktop, browser]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      MUSIC_RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - name: Require the current main commit before publishing
        id: current
        run: |
          publish=$(python3 tools/ci-version.py current)
          echo "publish=$publish" >> "$GITHUB_OUTPUT"
          if [ "$publish" != true ]; then
            echo 'Main has moved on; this superseded build will not publish a release.' >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Collect desktop release payloads only
        uses: actions/download-artifact@v4
        if: steps.current.outputs.publish == 'true'
        with:
          pattern: desktop-*
          path: dist
          merge-multiple: true
      - name: Collect browser release payload only
        uses: actions/download-artifact@v4
        if: steps.current.outputs.publish == 'true'
        with:
          name: browser-wasm
          path: dist
      - name: Verify full release set and checksums
        if: steps.current.outputs.publish == 'true'
        run: |
          python3 tools/ci-version.py source dist/MusicMachine-source.zip
          python3 tools/release-manifest.py dist
          (cd dist && sha256sum --check SHA256SUMS)
      - name: Upload complete draft and publish
        if: steps.current.outputs.publish == 'true'
        run: |
          publish=$(python3 tools/ci-version.py current)
          if [ "$publish" != true ]; then
            echo 'Main has moved on; skipping the superseded release.'
            exit 0
          fi
          tag="v$MUSIC_RELEASE_VERSION"
          if gh release view "$tag" --json isDraft,targetCommitish > "$RUNNER_TEMP/release.json" 2>/dev/null; then
            jq -e --arg sha "$GITHUB_SHA" '.isDraft == true and .targetCommitish == $sha' "$RUNNER_TEMP/release.json"
          else
            gh release create "$tag" --draft --target "$GITHUB_SHA" --title "MusicMachine $tag" --generate-notes --notes-file docs/release-notes.md
          fi
          gh release upload "$tag" dist/* --clobber
          publish=$(python3 tools/ci-version.py current)
          if [ "$publish" != true ]; then
            echo 'Main changed during upload; the obsolete release remains unpublished.'
            exit 0
          fi
          gh release edit "$tag" --draft=false --latest
