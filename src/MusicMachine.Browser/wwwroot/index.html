<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <base href="./">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#1e1e2e">
  <meta name="description" content="Make original game music with MusicMachine, a local-first tracker and synthesizer. Create songs, reusable instruments, and export WAV, FLAC or QOA in your browser.">
  <title>MusicMachine</title>
  <link rel="icon" href="./favicon.ico" sizes="any">
  <link rel="preload" id="webassembly">

  <script type="module" src="main#[.{fingerprint}].js"></script>

<body>
  <div id="out">
    <div class="avalonia-splash" role="status">
      <img src="./favicon.ico" alt="" width="80" height="80">

    <button id="enable-audio" type="button">Enable sound</button>
    <button id="dismiss-audio" type="button" aria-label="Dismiss audio notice">×</button>
